name: ecommerce-platform

# Cada microservicio tiene su propia base de datos (patrón "database per service").
# Con SQLite, la base es un archivo dentro de un volumen propio de cada servicio.
# Los valores por defecto son solo para desarrollo: define tu propio .env (ver .env.example).

x-node-service: &node-service
  restart: unless-stopped
  networks: [backend]

services:
  user-service:
    <<: *node-service
    build: ./services/user-service
    ports:
      - "${USER_SERVICE_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DB_PATH: /app/data/users.db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    volumes:
      - user-data:/app/data

  product-catalog-service:
    <<: *node-service
    build: ./services/product-catalog-service
    ports:
      - "${CATALOG_SERVICE_PORT:-3002}:3002"
    environment:
      PORT: 3002
      DB_PATH: /app/data/catalog.db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - catalog-data:/app/data

networks:
  backend:

volumes:
  user-data:
  catalog-data:
